name: 构建和发布版本

on:
  push:
    tags:
      - 'v*'  # 推送 v 开头的 TAG 时触发

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
      - name: 设置 JDK
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: 使用 Maven 构建
        run: mvn clean package
      - name: 创建 GitHub Release
        run: |
          RELEASE_TAG="${{ github.ref_name }}"
          gh release create "$RELEASE_TAG" target/*.jar -t "$RELEASE_TAG" -n "版本 $RELEASE_TAG"
        env:
          GITHUB_TOKEN: ${{ secrets.MYGITHUBTOKEN }}
